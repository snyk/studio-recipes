[pytest]
testpaths = tests
markers =
    integration: integration tests with real Snyk scans
    slow: tests with deliberate delays or real scans
    e2e: end-to-end tests that run subprocesses or real CLIs
    manual: opt-in tests that are skipped or gated unless explicitly requested
    secrets_load: manual Secrets At Commit load tests with real git commits and real Snyk scans
